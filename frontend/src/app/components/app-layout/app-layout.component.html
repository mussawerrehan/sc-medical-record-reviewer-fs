<div class="app-layout">
  <!-- Top Header -->
  <header class="header">
    <div class="header-content">
      <!-- Left: Logo and Brand -->
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div class="logo-text">
            <h1>SmartCycleAI</h1>
            <p>Clinical Documentation Intelligence</p>
          </div>
        </div>
      </div>

      <!-- Right: Search, Notifications, User -->
      <div class="header-right">
        <!-- Search -->
        <div class="search-container">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" placeholder="Search cases, patients...">
        </div>

        <!-- Notifications -->
        <button class="notification-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notification-badge">{{ notifications.length }}</span>
        </button>

        <!-- User Profile -->
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-role">{{ user.role }}</span>
          </div>
          <div class="user-avatar">{{ userInitials }}</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Navigation Items -->
    <nav class="nav-menu">
      <button 
        *ngFor="let item of navigation"
        class="nav-item"
        [class.active]="isActiveRoute(item.route)"
        (click)="navigateTo(item.route, item.id)"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container [ngSwitch]="item.icon">
            <g *ngSwitchCase="'home'">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9,22 9,12 15,12 15,22"/>
            </g>
            <g *ngSwitchCase="'clipboard'">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            </g>
            <g *ngSwitchCase="'shield'">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </g>
            <g *ngSwitchCase="'chart'">
              <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
            </g>
            <g *ngSwitchCase="'brain'">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <path d="M12 17h.01"/>
            </g>
            <g *ngSwitchCase="'activity'">
              <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
            </g>
            <g *ngSwitchCase="'settings'">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </g>
          </ng-container>
        </svg>
        <span>{{ item.name }}</span>
        <span *ngIf="item.badge" class="nav-badge" [class.new-badge]="item.badge === 'New'">{{ item.badge }}</span>
      </button>
    </nav>

    <!-- Today's Summary -->
    <div class="sidebar-summary">
      <h3>Today's Summary</h3>
      <div class="summary-item">
        <span>Cases Reviewed</span>
        <span>{{ todaySummary.casesReviewed }}</span>
      </div>
      <div class="summary-item">
        <span>Queries Sent</span>
        <span>{{ todaySummary.queriesSent }}</span>
      </div>
      <div class="summary-item">
        <span>DRG Impact</span>
        <span class="positive">{{ todaySummary.drgImpact }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="logout-btn" (click)="handleLogout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16,17 21,12 16,7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"/>
      </svg>
      <span>{{ getCurrentPageName() }}</span>
    </div>

    <!-- Page Content -->
    <div class="page-content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
